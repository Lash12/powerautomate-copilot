name: 🐛 Bug Report
description: Report a problem with the extension
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Copilot Chat
        2. Type "list my environments"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      placeholder: e.g. 1.90.0
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: Power Platform Cloud
      options:
        - Commercial (api.flow.microsoft.com)
        - GCC
        - GCC High
        - DoD
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Error Messages
      description: Paste any error output from the VS Code Output panel (Power Automate Copilot channel).
      render: text
